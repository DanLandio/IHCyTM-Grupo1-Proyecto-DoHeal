<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!--Es para que el ancho de la pantalla se adapte al tamaño del diapositivo(celular,tablet o pc)-->
    <meta name="Pagina principal" content="width=device-width, initial-scale=1.0">
    <title>Do-Heal</title>
    <!--Es para vincular los estilos(el archivo css) con el archivo vista(el esqueleto html)-->
    <link rel="stylesheet" href="../Estilos/estiloBasicoDoHeal.css">
</head>
<body>
    <header class="Barra-superior">
        <div class="Logo-con-Nombre">
            <img src="../Recursos/Imagenes/logo-doheal-cortado.png" alt="Logo Do-Heal" class="logo-imagen"> 
            <span class="Nombre-de-Startup">Do-Heal</span>
        </div>

        <nav class="botones-centrales">
            <a href="#" class="enlace-menu">Sobre Nosotros</a>
            <a href="#" class="enlace-menu">Como funciona</a>
            <a href="#" class="enlace-menu">Contacto</a>
        </nav>

        <div class="botones-derechos">
            <button class="btn-nav btn-primario">Registrar</button>
            <button class="btn-nav btn-secundario">Acceder</button>            
        </div>
            
    </header>

    <main class="Contenido-principal">

        <section class="Seccion-de-Bienvenida">

            <div class="Seccion-de-la-izquierda">
                <h1 class="Titulo-de-la-seccion">Simplifica la donación y la gestión de medicamentos</h1>

                <p class="Descripcion">
                    En Do-Heal, conectamos pacientes que tienen dificultades para acceder a los
                    medicamentos para acceder a los medicamentos que necesitan, con donantes 
                    dispuestos a ayudarlos
                </p>

                <div class="Seccion-de-abajo-izquierda">
                    <h2 class="Subtitulo">Participa ahora</h2>
                    <button class="btn-unete">Unete a Do-Heal</button>
                </div>
            </div>

            <div class="Seccion-derecha">
                <img src="../Recursos/Imagenes/MedicamentosDonacion.png" alt="Donacion de medicamentos" class="Medicamentos-donados-imagen">
            </div>

        </section>
        <!--aqui ira todo lo que añadamos despues -->
    </main>

    <!-- Aqui vinculamos con el script de java que tenemos en la carpeta-->
    <script src="../Scripts/scriptLandingPage.js"></script>

</body>

</html>
