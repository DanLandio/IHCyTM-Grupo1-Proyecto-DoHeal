<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salud | Do-Heal</title>
    <link rel="stylesheet" href="../Estilos/estiloComplementoDoHeal.css">
    <link rel="stylesheet" href="../Estilos/estiloPlataformaDoHeal.css">
    <link rel="icon" href="../../favicon.ico">
    <script src="../Scripts/scriptPlataforma.js"></script>
    <script src="../Scripts/scriptPlataformaVistas.js"></script>
    <script src="../Scripts/scriptListadoElementos.js"></script>
</head>

<body>
    <header class="header-plataforma">
        <div class="elementos-header-plataforma">
            
            <div class="izquierda">
                <button class="hamburguesa" id="boton-menu" onclick="abreMenuHamburguesa('menu-opciones', 'boton-menu')">
                ☰
                </button>
                <div id="logo-doheal">
                <img src="../Recursos/Imagenes/logo-doheal-blanco-cortado.png" style="width: 4rem; height: auto;">
                <h2>Do-Heal</h2>
                </div>
                
            </div>
            <div class="centrado">
                <h1>Salud</h1>
            </div>
            <div class="derecha">
                <h2>Jorge</h2>
                <button class="hamburguesa" id="boton-notificaciones" onclick="abreMenuHamburguesa('menu-notificaciones','boton-notificaciones')">
                    <img src="../Recursos/Iconos/campana.svg" style="width: 2rem; height: auto;">
                    <span class="notificacion-contador">4</span>
                </button>
                
                <img src="../Recursos/Iconos/engranaje.svg" style="width: 2rem; height: auto;">
            </div>
        </div>
        

        <nav id="menu-opciones">
            <a href="../Estructuras/vistaPlataformaInicio.html">
                <img src="../Recursos/Iconos/casa.svg" class="icono">
                Inicio
            </a>
            <a href="../Estructuras/vistaPlataformaSalud.html">
                <img src="../Recursos/Iconos/pildora.svg" class="icono">
                Salud
            </a>
            <a href="../Estructuras/vistaPlataformaBusqueda.html">
                <img src="../Recursos/Iconos/lupa.svg" class="icono">
                Buscar
            </a>
            <a href="../Estructuras/vistaPlataformaSolicitudes.html">
                <img src="../Recursos/Iconos/correo.svg" class="icono">
                Solicitudes
            </a>
            <a href="../Estructuras/vistaPlataformaPerfil.html">
                <img src="../Recursos/Iconos/usuario.svg" class="icono">
                Perfil
            </a>
        </nav>

        <nav id="menu-notificaciones">
            <div class="notificacion" id="bandeja-notificaciones">

                <template id="plantilla-notificaciones">
                    <div class="notificacion-elemento">
                    <button class="emergente-cerrar">&times;</button>
                    <div>
                        <img data-i="imagen" src="../Recursos/Imagenes/logo-doheal-cortado.png" class="icono">
                    </div>
                    
                    <div class="notificacion-contenido">
                        <h3 data-i="titulo" class="sin-titulo">Titulo</h3>
                        <p data-i="contenido" class="sin-titulo">Lorem ipsum dolor sit amet consectetur adipisicing elit. impedit?</p>
                        
                    </div>
                    
                </div>
                </template>
                <script>mostrarLista(notificaciones, 'plantilla-notificaciones', 'bandeja-notificaciones')</script>
            </div>
        </nav>
        
        </header>
        
        
    <section class="seccion-plataforma">
        <div class="division-vistas ordenar-horizontal">
            <button id="boton-vista-dosis" onclick="cambiarVista('vista-dosis','boton-vista-dosis')">Dosis</button>
            <button id="boton-vista-medicina" onclick="cambiarVista('vista-medicina','boton-vista-medicina')">Medicinas</button>
            <button id="boton-vista-recetas" onclick="cambiarVista('vista-recetas','boton-vista-recetas')">Recetas</button>
        </div>
        <!--------------------------------------------------->
        <section class="vista seccion-interna" id="vista-dosis">
            <hr>
            <div class="contenedor-horizontal">
                <h1 class="espaciado">Recordatorios de dosis</h1>
                <button onclick="abrirModalRegistro('plantilla-registro-dosis')">Registrar tratamiento</button>
            </div>
            <div class="contenedor-plataforma listado" id="contenedor-dosis">
                <!--Plantilla para una dosis registrada-->
                <template id="plantilla-dosis">
                <div class="elemento-listado">
                    <img data-i="imagen" class="elemento-img" src="../Recursos/Imagenes/logo-doheal.png">
                    <div class="elemento-texto">
                    <p data-i="medicamento">Medicamento</p>
                    <p data-i="dosis">Dosis</p>
                    <p data-i="proximaToma">Proxima toma</p>
                    <p data-i="intervalo">Intervalo</p>
                    <p data-i="estado">Estado de recordatorio</p>
                    </div>
                    <div class="elemento-accion">
                        <button data-i="btn" data-tipo="detalle" data-plantilla="plantilla-detalle-dosis">Detalles</button>
                    </div>
                </div>
                </template>

                <!--Plantilla para ventana emergente de detalles de dosis-->
                <template id="plantilla-detalle-dosis">
                    
                        <img class="emergente-img" data-i="imagen">
                        <div class="emergente-titulo">
                            
                            <h3>Detalles del tratamiento</h3>
                            <div class="ordenar-horizontal">
                                <button>Editar</button>
                                <button class="alterno">Eliminar</button>
                            </div>
                        </div>
                        
                        <div class="emergente-contenido emergente-detalles">
                            <div class="emergente-item">
                                <p>Medicina: </p>
                                <p data-i="medicamento">nombre</p>
                            </div>
                            <div class="emergente-item">
                                <p>Proxima toma: </p>
                                <p data-i="proximaToma">toma</p>
                            </div>
                            <div class="emergente-item">
                                <p>Dosis: </p>
                                <p data-i="dosis">dosis</p>
                            </div>
                            <div class="emergente-item">
                                <p>Intervalo: </p>
                                <p data-i="intervalo"> inter</p>
                            </div>
                            <div class="emergente-item">
                                <p>Estado: </p>
                                <p data-i="estado"> estado</p>
                            </div>
                        </div>
                </template>

                <!--Plantilla para ventana emergente de registro de dosis-->
                <template id="plantilla-registro-dosis">
                    
                        <img class="emergente-img" src="../Recursos/Imagenes/no-image.png">
                        <div class="emergente-titulo">
                            
                            <h3>Registro de recordatorio</h3>
                            <div class="ordenar-horizontal">
                                <button>Subir Imagen</button>
                            </div>
                        </div>
                        
                        <div class="emergente-contenido emergente-detalles">
                            <form>
                                <div class="emergente-item">
                                    <label for="dosis-nombre">Medicamento:</label>
                                    <input id="dosis-nombre" type="text" name="dosis-nombre">
                                </div>
                                <div class="emergente-item">
                                    <label for="dosis-dosis">Dosis:</label>
                                    <input id="dosis-dosis" type="text" name="dosis-dosis">
                                </div>
                                <div class="emergente-item">
                                    <label for="dosis-intervalo">Intervalo:</label>
                                    <div class="emergente-horizontal">
                                        <input type="number" min="1" id="dosis-intervalo" name="dosis-intervalo">
                                        <select name="intervalo-unidad">
                                        <option>Minutos</option>
                                        <option>Horas</option>
                                        <option>Dias</option>
                                        <option>Semanas</option>
                                    </select>
                                    </div>
                                    
                                </div>

                                <button type="submit">Guardar</button>
                            </form>

                        </div>
                </template>

                <script>mostrarLista(dosisRegistradas, 'plantilla-dosis', 'contenedor-dosis')</script>
        </section>
        <!--------------------------------------------------->
        <section class="vista seccion-interna" id="vista-medicina">
            <hr>
            <div class="contenedor-horizontal">
            <h1 class="espaciado">Medicinas registradas</h1>
            <button onclick="abrirModalRegistro('plantilla-registro-medicamento')">Registrar medicina</button>
            </div>

            <div class="contenedor-plataforma listado" id="contenedor-medicinas">
                <!--Plantilla para elemento de lista de medicinas-->
                <template id="plantilla-medicinas">
                <div class="elemento-listado">
                    <img data-i="imagen" class="elemento-img" src="../Recursos/Imagenes/logo-doheal.png">
                    <div class="elemento-texto">
                    <h3 data-i="nombre" class="elemento-titulo">Nombre</h3>
                    <p data-i="presentacion">Presentacion</p>
                    <p data-i="estado">Estado</p>
                    <p data-i="caduca">Caduca</p>
                    </div>
                    <div class="elemento-accion">
                        <button data-i="btn" data-tipo="detalle" data-plantilla="plantilla-detalle-medicamento">Detalles</button>
                    </div>
                </div>
                </template>

                <!--Plantilla para ventana emergente de detalles de medicina-->
                <template id="plantilla-detalle-medicamento">
                    
                        <img class="emergente-img" data-i="imagen">
                        <div class="emergente-titulo">
                            
                            <h3>Detalles del medicamento</h3>
                            <div class="ordenar-horizontal">
                                <button>Editar</button>
                                <button class="alterno">Eliminar</button>
                            </div>
                        </div>
                        
                        <div class="emergente-contenido emergente-detalles">
                            <div class="emergente-item">
                                <p>Nombre: </p>
                                <p data-i="nombre">nombre</p>
                            </div>
                            <div class="emergente-item">
                                <p>Fecha de caducidad: </p>
                                <p data-i="caduca">fecha</p>
                            </div>
                            <div class="emergente-item">
                                <p>Presentacion: </p>
                                <p data-i="presentacion">presentacion</p>
                            </div>
                            <div class="emergente-item">
                                <p>Estado: </p>
                                <p data-i="estado"> estado</p>
                            </div>
                            <div class="emergente-item">
                                <p>Descripcion: </p>
                                <p data-i="descripcion"> estado</p>
                            </div>
                            <div class="emergente-item">
                                <p>Numero de lote: </p>
                                <p data-i="lote"></p>
                            </div>
                        </div>
                </template>


                <!--Plantilla para ventana emergente de registro de medicinas-->
                <template id="plantilla-registro-medicamento">
                    
                        <img class="emergente-img" src="../Recursos/Imagenes/no-image.png">
                        <div class="emergente-titulo">
                            
                            <h3>Registro de medicina</h3>
                            <div class="ordenar-horizontal">
                                <button>Subir Imagen</button>
                            </div>
                        </div>
                        
                        <div class="emergente-contenido emergente-detalles">
                            <form>
                                <div class="emergente-item">
                                    <label for="medicina-nombre">Medicamento:</label>
                                    <input type="text" id="medicina-nombre" name="nombre">
                                </div>

                                <div class="emergente-item">
                                    <label for="medicina-lote">Número de lote:</label>
                                    <input type="text" id="medicina-lote" name="lote">
                                </div>

                                <div class="emergente-item">
                                    <label for="medicina-caduca">Fecha de caducidad:</label>
                                    <input type="month" id="medicina-caduca" name="caduca">
                                </div>

                                <div class="emergente-item">
                                    <label for="medicina-descripcion">Descripción:</label>
                                    <textarea id="medicina-descripcion" name="descripcion"></textarea>
                                </div>
                                <button type="submit">Guardar</button>
                            </form>

                        </div>
                </template>

                <script>mostrarLista(medicinasRegistradas, 'plantilla-medicinas', 'contenedor-medicinas')</script>
            </div>
            
        </section>
        <!--------------------------------------------------->
        <section class="vista seccion-interna" id="vista-recetas">
            <hr>
            <div class="contenedor-horizontal">
                <h1 class="espaciado">Recetas medicas registradas</h1>
                <button onclick="abrirModalRegistro('plantilla-registro-recetas')">Registrar receta medica</button>
            </div>
            
            <div class="contenedor-plataforma cuadricula" id="contenedor-recetas">
                <template id="plantilla-recetas">
                <div class="elemento-cuadricula">
                    <img data-i="imagen" class="elemento-img" src="../Recursos/Imagenes/logo-doheal.png">
                    <div class="elemento-texto">
                    <p data-i="medicamento">Medicamento</p>
                    <p data-i="dosis">Dosis</p>
                    <p data-i="frecuencia">Frecuencia</p>
                    <p data-i="duracion">Duracion</p>
                    <p data-i="diagnostico">Diagnostico</p>
                    <p data-i="estado">Estado de receta</p>
                    </div>
                    <div class="elemento-accion">
                        <button data-i="btn" data-tipo="detalle" data-plantilla="plantilla-detalle-receta">Detalles</button>
                    </div>
                </div>
                </template>

                
                <!--Plantilla para ventana emergente de detalles de recetas-->
                <template id="plantilla-detalle-receta">
                    
                        <img class="emergente-img" data-i="imagen">
                        <div class="emergente-titulo">
                            
                            <h3>Detalles de la receta</h3>
                            <div class="ordenar-horizontal">
                                <button>Editar</button>
                                <button class="alterno">Eliminar</button>
                            </div>
                        </div>
                        
                        <div class="emergente-contenido emergente-detalles">
                            <div class="emergente-item">
                                <p>Medicamento: </p>
                                <p data-i="medicamento">nombre</p>
                            </div>
                            <div class="emergente-item">
                                <p>Dosis: </p>
                                <p data-i="dosis">dosis</p>
                            </div>
                            <div class="emergente-item">
                                <p>Frecuencia: </p>
                                <p data-i="frecuencia">frecuencia</p>
                            </div>
                            <div class="emergente-item">
                                <p>Duracion: </p>
                                <p data-i="duracion"> duracion</p>
                            </div>
                            <div class="emergente-item">
                                <p>Diagnostico: </p>
                                <p data-i="diagnostico"> diagnostico</p>
                            </div>
                            <div class="emergente-item">
                                <p>Estado: </p>
                                <p data-i="estado"></p>
                            </div>
                        </div>
                </template>


                <!--Plantilla para ventana emergente de registro de medicinas-->
                <template id="plantilla-registro-recetas">
                    
                        <img class="emergente-img" src="../Recursos/Imagenes/no-image.png">
                        <div class="emergente-titulo">
                            
                            <h3>Registro de receta</h3>
                            <div class="ordenar-horizontal">
                                <button>Subir Imagen</button>
                            </div>
                        </div>
                        
                        <div class="emergente-contenido emergente-detalles">
                            <form>
                                <div class="emergente-item">
                                    <label for="receta-nombre">Medicamento:</label>
                                    <input type="text" id="receta-nombre" name="nombre">
                                </div>
                                <div class="emergente-item">
                                    <label for="receta-dosis">Dosis:</label>
                                    <input type="text" id="receta-dosis" name="dosis">
                                </div>
                                <div class="emergente-item">
                                    <label for="receta-frecuencia-cantidad">Frecuencia:</label>
                                    <div class="emergente-horizontal">
                                        <input type="number" min="1" id="receta-frecuencia-cantidad" name="frecuencia-cantidad">
                                        <select id="receta-frecuencia-unidad" name="frecuencia-unidad">
                                            <option>Minutos</option>
                                            <option>Horas</option>
                                            <option>Dias</option>
                                            <option>Semanas</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="emergente-item">
                                    <label for="receta-duracion-cantidad">Duracion:</label>
                                    <div class="emergente-horizontal">
                                        <input type="number" min="1" id="receta-duracion-cantidad" name="duracion-cantidad">
                                        <select id="receta-duracion-unidad" name="duracion-unidad">
                                            <option>Dias</option>
                                            <option>Semanas</option>
                                            <option>Meses</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="emergente-item">
                                    <label for="receta-diagnostico">Diagnostico:</label>
                                    <input type="text" id="receta-diagnostico" name="diagnostico">
                                </div>
                                <button type="submit">Guardar</button>
                            </form>

                        </div>
                </template>


                <script>mostrarLista(recetasRegistradas, 'plantilla-recetas', 'contenedor-recetas')</script>
            </div>

            
        </section>
    </section>

    <div class="Pantalla-entera fondo-emergente" id="modal">
        <div class="emergente">
            <button class="emergente-cerrar" id="modal-cerrar" onclick="cerrarModal()">&times;</button>
            <div id="modal-contenido" class="emergente-interior">

            </div> 
            
        </div> 
    </div>

        <script>
        const parametrosLink = new URLSearchParams(window.location.search);
        const vista = parametrosLink.get("vista")
        const modo = parametrosLink.get("modo")
        if (vista == "medicinas"){
            cambiarVista('vista-medicina','boton-vista-medicina');
            if (modo == "registrar"){
                abrirModalRegistro('plantilla-registro-medicamento');
            }
        }
        else{
            cambiarVista('vista-dosis','boton-vista-dosis')
        }
    </script>
</body>

</html>
